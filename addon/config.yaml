# Version: V26.281.1108
# Home Assistant add-on manifest for LunarReef.
name: LunarReef
version: "0.2.0"
slug: lunarreef
description: Makes the lunar channel of EcoTech Radion XR15 lights (Neptune Apex MXM module) follow the real moon at your location
url: https://github.com/mad-science-lab/LunarReef
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# The settings page is served through Ingress: Home Assistant's login protects it
# and no port is published on the LAN.
ingress: true
ingress_port: 8788
panel_icon: mdi:moon-waning-crescent
panel_title: LunarReef

# Read-only use of Home Assistant's API for one thing: on first start, take the
# latitude/longitude from HA's home location.
homeassistant_api: true

# Everything is configured in the web page (stored in /data/config.json).
options: {}
schema: {}
